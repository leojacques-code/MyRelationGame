<title>Mi Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Mise en page : colonne téléphone — barre des deux personnages, décor, panneau d'actions, onglets */
  --ink:#1b2236; --ink2:#2b3552; --paper:#f7f3ea; --door:#d7352b; --door2:#a9241c; --plaid:#3f8f5f;
  --gold:#e9c46a; --muted:#69718a; --line:#e4dccb;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{cursor:pointer;font-family:var(--body)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--paper);position:relative;overflow:hidden}
#top{display:flex;gap:8px;align-items:stretch;padding:8px 10px;background:var(--ink);color:#fff;flex:none}
.who{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--ink2);border:2px solid transparent;border-radius:14px;padding:5px 8px;color:#fff;min-height:54px;text-align:left;opacity:.62}
.who.on{opacity:1;border-color:var(--gold);background:#35426c}
.who .por{width:38px;height:40px;flex:none}
.who span{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.who b{font-family:var(--display);font-weight:600;font-size:15px}
.who i{font-style:normal;font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.who em{margin-left:auto;font-style:normal;font-size:9px;letter-spacing:1px;color:var(--gold);align-self:flex-start}.who em.ok{color:#8fe0a8}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:none}
.mid b{font-family:var(--display);font-size:17px;font-weight:600}
.mid span{font-size:12px;color:#cfd6ea;white-space:nowrap;font-variant-numeric:tabular-nums}
#sceneWrap{position:relative;background:var(--ink);flex:none}
#scene{display:block;width:100%;height:auto;max-height:44vh;max-height:44dvh;aspect-ratio:360/300}
#scene [data-hs]{cursor:pointer}
#sceneTitle{position:absolute;left:8px;top:8px;background:#1b2236cc;color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;pointer-events:none;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#roomTabs{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
#roomTabs button{background:#ffffffe6;border:0;border-radius:999px;min-height:36px;padding:6px 12px;font-weight:800;font-size:12.5px;color:var(--ink)}
#roomTabs button.on{background:var(--gold)}
#bubble{position:absolute;left:10px;right:10px;top:38px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:9px 12px;font-size:14.5px;line-height:1.35;opacity:0;transform:translateY(-6px);transition:.18s;z-index:5}
#bubble.show{opacity:1;transform:none}
#panel{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 18px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
#tabs{display:flex;background:#fff;border-top:1.5px solid var(--line);flex:none}
#tabs button{flex:1;min-height:60px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 0}
#tabs button span{font-size:21px;line-height:1.1}
#tabs button.on{color:var(--door);box-shadow:inset 0 3px 0 var(--door)}
#tabs button.pulse span{animation:pulse 1s ease-in-out infinite alternate}
body.dlgmode #tabs{display:none}
h2{font-family:var(--display);font-weight:600;margin:0;font-size:22px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:16px;margin:8px 0 0;color:var(--ink2)}
.hello p{margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.35}
.tip{background:#fff6d8;border:1.5px solid var(--gold);border-radius:14px;padding:10px 12px;font-size:14.5px}
.done{color:var(--muted);font-size:14.5px;margin:0;background:#fff;border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;line-height:1.35}
.act{width:100%;display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:9px 12px;min-height:62px;text-align:left;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.act .ic{font-size:26px;width:40px;text-align:center;flex:none;line-height:1}
.act .ic .por{width:40px;height:42px;display:block}
.act .tx{min-width:0}

<body>
<div id="app">
  <header id="top"></header>
  <button id="goal" data-tab="proj" aria-label="Prochaine étape"></button>
  <div id="sceneWrap">
    <svg id="scene" viewBox="0 0 360 300" role="img" aria-label="Décor de la scène"></svg>
    <div id="sceneTitle"></div>
    <div id="roomTabs"></div>
    <button id="decoBtn" data-decor="1" aria-label="Décorer le logement">🎨 Décorer</button>
    <div id="bubble" role="status"></div>
  </div>
  <main id="panel"></main>
  <nav id="tabs" aria-label="Onglets"></nav>
  <div id="toasts" aria-live="polite"></div>
  <div id="overlay"></div>
</div>
<script>
/* ===== save.js ===== */
/* =====================================================================
   MODULE SAUVEGARDE — src/save.js
   Tout ce qui lit ou écrit la partie passe par ici. Rien d'autre dans le
   jeu ne touche à localStorage.

   Pour brancher Supabase (Codex) :
     Save.setRemote({
       pull: async () => stateOuNull,          // lu au démarrage
       push: async (state, reason) => {...}    // appelé après chaque écriture locale
     });
   L'état est un objet JSON pur (pas de fonction, pas de Date, pas de classe).
   Résolution de conflit suggérée : garder l'état dont meta.rev est le plus
   grand, puis meta.updatedAt en cas d'égalité.
   ===================================================================== */
const Save = (() => {
  const KEY = 'milife.save.v1';          // clé historique : ne jamais la renommer
  const BACKUP_KEY = 'milife.save.v1.backup';
  const CORRUPT_KEY = 'milife.save.v1.corrupt';
  const VERSION = 2;                     // v2 : surprises quotidiennes, décor, inventaire rangé
  let remote = null;
  let memoryFallback = null;      // si localStorage est indisponible
  let lastError = null;
  let storageOk = true;           // false si la dernière écriture locale a échoué
  let localProblem = null;        // {raw, error} : une partie existe mais n'est pas lisible par cette version

  /** Forme complète d'une partie neuve. C'est LA référence du schéma. */
  function blank() {
    return {
      meta: { version: VERSION, gameId: 'g' + Math.random().toString(36).slice(2, 10),
              createdAt: Date.now(), updatedAt: Date.now(), rev: 0, lastReason: 'new' },
      day: 1,                 // jour de jeu en cours
      date: Date.now(),       // date du calendrier dans le jeu (ms) : part de la vraie date, saute de fête en fête
      fete: null,             // {id, done} fête du jour (Noël, anniversaire…), ou null
      stage: 0,               // 0 deux apparts · 1 appart ensemble · 2 maison · 3 manoir
      active: 'leonore',      // personnage qui tient le téléphone
      chars: {
        // moves : moments restants aujourd'hui (2 par jour) · energy / mood : besoins de 0 à 10
        leonore: { money: 60,  moves: 2, energy: 7, mood: 7, hunger: 7, talked: false, outfit: 'l_pull', med: 0 },
        leo:     { money: 120, moves: 2, energy: 7, mood: 7, hunger: 7, talked: false, outfit: 'o_chemise', deals: 0, cine: 0 }
      },
      pot: 0,                 // cagnotte commune (projets)
      love: 1,                // complicité
      items: [],              // [{id, owner, day, home?, room?, x?, y?, stored?}] ; home/room/x/y si placé à la main ; stored = rangé dans l'inventaire
      firstItem: null,        // {id, owner, day} tout premier achat (revient au final)
      outfits: { leonore: ['l_pull'], leo: ['o_chemise'] },
      memories: [],           // [{day, icon, title, text, ref?}] ; ref = 'pack:<épisode>' : texte lu dans le paquet privé
      registre: [],           // [{n, day, text}] Registre des incidents de Mathys
      regNo: 212,             // dernier numéro d'incident
      flags: {},              // choix dont dépendent des scènes (wish, appart, house, specialty…)
      seen: {},               // {sceneId: jour} scènes déjà jouées
      counters: {},           // rotation des textes, compteurs d'activités (mots = post-its d'origine distribués)
      pets: [],               // [{kind, name, day}]
      kids: [],               // [{name, born, st, hair}]
      party: { invites: false, buffet: null, deco: false },
      stats: { plaids: 0, bestPlaid: 0, bestClosing: 0, flushes: 0, petition: 0, ms: 0, finishMs: 0 },  // ms = temps de jeu
      used: {},               // interactions avec le décor déjà faites aujourd'hui {"leo:canape:sieste": 1}
      trouvailles: [],        // objets cachés du jour [{kind:'sock'|'chou', home, room, x, y}]
      found: { socks: 0, chous: 0 },   // collections : chaussettes de Mathys, chouchous de Léonore
      mail: { day: 0, id: -1, read: true },  // courrier du jour
      wants: { leonore: null, leo: null },   // envie du jour de chacun (id d'activité) : la combler rapporte un bonus
      ach: {},                // défis réussis {index: 1}
      rel: {},                // liens avec les proches {id: points}
      visitor: { leonore: null, leo: null },  // le proche de passage aujourd'hui
      moodlets: [],           // [{who, t, day}] petites humeurs du jour
      notes: [],              // [{from, text, ts, day, read, auto?}] petits mots du frigo ; auto = post-it d'origine (MOTS_LEO)
      login: { day: '', streak: 0 },          // dernier jour réel de connexion, jours d'affilée
      ended: false,           // la grande soirée a eu lieu
      /* v2 — surprises quotidiennes */
      daily: {
        lastGameDay: 0,       // dernier jour de jeu où une surprise a été débloquée
        unlocked: [],         // [{id, day, kind}] dans l'ordre de déblocage ; id = 'mot:<n>' ou 'ep:<id épisode>'
        ep: {},               // {idÉpisode: {opened, read, readDay, answers:{}, items:{}, plays}}
        anniv: {},            // {'<id>:<année>': jour réel} rappels d'anniversaire déjà montrés
        later: ''             // jour réel où elle a choisi « plus tard »
      },
      /* v2 — décor */
      decor: {
        rooms: {},            // {'<logement>:<pièce>': {wall, floor, rug, curtain, light}}
        variants: {},         // {idObjet: clé de variante}
        on: {},               // états d'objets interactifs {guirlande: true}
        shelf: {},            // {'<logement>': idObjet exposé sur l'étagère}
        layouts: {}           // {'<logement>': {at, items:[{id, room, x, y, stored}], rooms}} dispositions des logements quittés
      }
    };
  }

  const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
  const clone = v => JSON.parse(JSON.stringify(v));

  /** Contrôle de structure AVANT toute écriture. Renvoie {ok:true} ou {ok:false, error}. */
  function validate(s) {
    if (s === null || s === undefined) return { ok: false, error: 'Ce code ne contient aucune partie.' };
    if (!isObj(s)) return { ok: false, error: 'Ce code ne contient pas une partie de Mi Life.' };
    if (!isObj(s.meta)) return { ok: false, error: 'Ce code ne contient pas une partie de Mi Life (en-tête absent).' };
    const v = s.meta.version;
    if (typeof v !== 'number' || v < 1) return { ok: false, error: 'Version de sauvegarde inconnue.' };
    if (v > VERSION) return { ok: false, error: `Cette partie vient d’une version plus récente du jeu (v${v}). Ouvre-la avec cette version.` };
    if (!Number.isInteger(s.day) || s.day < 1) return { ok: false, error: 'Partie illisible : jour de jeu invalide.' };
    if (!Number.isInteger(s.stage) || s.stage < 0 || s.stage > 3) return { ok: false, error: 'Partie illisible : logement invalide.' };
    if (!isObj(s.chars) || !isObj(s.chars.leonore) || !isObj(s.chars.leo)) return { ok: false, error: 'Partie illisible : personnages absents.' };

    for (const k of ['items', 'memories', 'notes', 'registre', 'kids', 'pets']) if (s[k] !== undefined && !Array.isArray(s[k])) return { ok: false, error: `Partie illisible : « ${k} » abîmé.` };
    for (const k of ['flags', 'seen', 'counters']) if (s[k] !== undefined && !isObj(s[k])) return { ok: false, error: `Partie illisible : « ${k} » abîmé.` };

  /** Complète une sauvegarde ancienne ou partielle. Idempotent : migrate(migrate(s)) ≡ migrate(s). */
  function migrate(s) {
    const b = blank();
    if (!isObj(s)) return b;
    const fill = (dst, src) => {
      for (const k in src) {
        if (dst[k] === undefined || dst[k] === null && src[k] !== null && k !== 'firstItem' && k !== 'fete') dst[k] = src[k];
        else if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && typeof dst[k] === 'object' && !Array.isArray(dst[k])) fill(dst[k], src[k]);

    const fix = t => (typeof t === 'string' ? t.replace(/Gosio(?!t)/g, 'Gosiot').replace(/GOSIO(?!T)/g, 'GOSIOT') : t);
    out.kids.forEach(k => { k.name = fix(k.name); });
    out.memories.forEach(m => { m.title = fix(m.title); m.text = fix(m.text); });
    out.registre.forEach(r => { r.text = fix(r.text); });
    // objets : on garde ids, ordre et placements ; on nettoie seulement les champs illisibles
    out.items.forEach(i => { if (i.x != null && (typeof i.x !== 'number' || typeof i.y !== 'number')) { delete i.x; delete i.y; delete i.home; delete i.room; } });
    if (!Array.isArray(out.daily.unlocked)) out.daily.unlocked = [];

  }

  /** Lecture au démarrage. Renvoie un état ou null (pas de partie). */
  async function load() {
    let local = readLocal();
    if (remote && remote.pull) {
      try {
        const r = await remote.pull();
        if (r && validate(r).ok && (!local || (r.meta && r.meta.rev > local.meta.rev))) local = migrate(r);
      } catch (e) { lastError = e; }
    }

  }

  function write(state, reason) {
    state.meta.updatedAt = Date.now();
    state.meta.rev = (state.meta.rev || 0) + 1;
    state.meta.lastReason = reason || 'auto';
    const json = JSON.stringify(state);

    try { localStorage.setItem(KEY, json); memoryFallback = null; }
    catch (e) { lastError = e; memoryFallback = json; ok = false; }
    storageOk = ok;
    if (remote && remote.push) {
      try { Promise.resolve(remote.push(JSON.parse(json), state.meta.lastReason)).catch(e => { lastError = e; }); }
      catch (e) { lastError = e; }
    }
    return ok;
  }

  function clear() {
    memoryFallback = null;
    try { localStorage.removeItem(KEY); } catch (e) { lastError = e; }
  }

  /** Garde le texte brut d'une partie illisible (le plus récent), pour pouvoir la reprendre plus tard. */
  function keepRaw(raw) { try { localStorage.setItem(CORRUPT_KEY, raw); return true; } catch (e) { lastError = e; return false; } }
  /** Copie de secours avant un remplacement (une seule, la plus récente). */
  function backup(state, reason) {
    if (!state) return false;
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify({ at: Date.now(), reason: reason || '', state })); return true; }
    catch (e) { lastError = e; return false; }
  }
  function readBackup() {
    try { const b = JSON.parse(localStorage.getItem(BACKUP_KEY) || 'null'); if (b && validate(b.state).ok) return b; } catch (e) {}

  }

  /** Code texte à copier d'un téléphone à l'autre en attendant la synchro. */
  function exportCode(state) {
    const bytes = new TextEncoder().encode(JSON.stringify(state));
    let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
    return 'MILIFE1.' + btoa(bin);
  }
  /** Décode et vérifie un code (ou un JSON brut). Lève une Error au message lisible ; ne touche jamais au stockage. */
  function decodeCode(code) {
    let c = String(code || '').trim();
    if (!c) throw new Error('Le code est vide.');
    let json;
    if (c[0] === '{' || c === 'null') json = c;
    else {
      c = c.replace(/^MILIFE1\./, '').replace(/\s+/g, '');
      if (!/^[A-Za-z0-9+/]+=*$/.test(c)) throw new Error('Ce code est abîmé (caractères inattendus). Recopie-le en entier.');

      catch (e) { throw new Error('Ce code est incomplet ou abîmé. Recopie-le en entier, de « MILIFE1. » jusqu’au bout.'); }
    }
    let s;
    try { s = JSON.parse(json); } catch (e) { throw new Error('Ce code est incomplet ou abîmé. Recopie-le en entier.'); }
    const v = validate(s);
    if (!v.ok) throw new Error(v.error);
    return migrate(clone(s));
  }
  const importCode = decodeCode;

  return { KEY, BACKUP_KEY, VERSION, blank, validate, migrate, load, write, clear, backup, readBackup, exportCode, decodeCode, importCode, keepRaw, get localProblem() { return localProblem; },
           setRemote: a => { remote = a; }, get lastError() { return lastError; }, get storageOk() { return storageOk; } };
})();

function pet(kind, x, y, s) {
  const p = PETS[kind] || PETS.teckel, L = p.len, H = p.h; s = s || 1;
  let g = `<g data-hs="pet" transform="translate(${x},${y}) scale(${s})"><ellipse cx="0" cy="1" rx="${L + 6}" ry="3" fill="#0002"/>`;
  const legH = p.cat ? 4 : (p.low ? 3.5 : 8);
  g += `<rect x="${-L + 2}" y="${-legH}" width="3.4" height="${legH}" rx="1.5" fill="${p.c}"/><rect x="${L - 6}" y="${-legH}" width="3.4" height="${legH}" rx="1.5" fill="${p.c}"/>`;
  if (p.tail === 'thin') g += `<path d="M${-L},${-legH - H} q-6,-5 -8,-9" stroke="${p.c}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  if (p.tail === 'plume') g += `<path d="M${-L},${-legH - H} q-10,-4 -9,-14 q6,5 11,9Z" fill="${p.c2}"/>`;
  if (p.tail === 'curl') g += `<circle cx="${-L - 1}" cy="${-legH - H - 5}" r="4.5" fill="none" stroke="${p.c}" stroke-width="3.4"/>`;
  if (p.tail === 'cat') g += `<path d="M${-L},${-legH - 3} q-9,-2 -8,-14" stroke="${p.c}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if (p.tail === 'pom') g += `<circle cx="${-L - 1}" cy="${-legH - 4}" r="3" fill="#fff"/>`;
  g += `<ellipse cx="0" cy="${-legH - H + 1}" rx="${L}" ry="${H}" fill="${p.c}"/><ellipse cx="2" cy="${-legH - H + 4}" rx="${L * .6}" ry="${H * .5}" fill="${p.c2}" opacity=".7"/>`;
  const hx = L - 1, hy = -legH - H - (p.cat ? 5 : 4), hr = p.cat ? 6.5 : 6;
  if (p.ear === 'point') g += `<path d="M${hx - 5},${hy - 3} l1,-7 l4,5Z M${hx + 5},${hy - 3} l-1,-7 l-4,5Z" fill="${p.c}"/>`;
  if (p.ear === 'bunny') g += `<rect x="${hx - 6}" y="${hy - 1}" width="3.6" height="11" rx="1.8" fill="${p.c2}"/><rect x="${hx + 3}" y="${hy - 1}" width="3.6" height="11" rx="1.8" fill="${p.c2}"/>`;
  g += `<circle cx="${hx}" cy="${hy}" r="${hr}" fill="${p.c}"/>`;
  if (!p.cat) g += `<ellipse cx="${hx + 5.5}" cy="${hy + 1.5}" rx="4" ry="2.8" fill="${kind === 'shiba' || kind === 'corgi' ? p.c2 : p.c}"/><circle cx="${hx + 8.6}" cy="${hy + .6}" r="1.2" fill="#111"/>`;
  else g += `<path d="M${hx - 1},${hy + 2} l1,1 l1,-1" stroke="#7a3b2e" fill="none" stroke-width=".8"/>`;
  if (p.ear === 'flop') g += `<ellipse cx="${hx - 3.5}" cy="${hy + 2}" rx="2.6" ry="5" fill="${shade(p.c, -28)}"/>`;
  g += `<circle cx="${hx + 1.5}" cy="${hy - 1}" r="1.1" fill="#111"/>${p.cat ? `<circle cx="${hx - 3}" cy="${hy - 1}" r="1.1" fill="#111"/>` : ''}</g>`;
  return g;
}

/* ---------- Éléments de décor partagés ---------- */
const D = {
  parquet: (c, c2) => D.floor('parquet', c, c2),
  /* Sol d'une pièce : le réglage de la pièce (mode Décorer) prime sur le sol d'origine */
  floor: (kind, c, c2) => {
    const f = ART.floor(); if (f) { kind = f[2]; c = f[3]; c2 = f[4]; }
    let s = `<rect y="195" width="360" height="105" fill="${c}"/>`;
    if (kind === 'tiles') { for (let i = 0; i <= 12; i++) s += `<path d="M${i * 30},195 V300" stroke="${c2}"/>`; for (let i = 0; i < 4; i++) s += `<path d="M0,${195 + i * 30} H360" stroke="${c2}"/>`; return s + `<rect y="192" width="360" height="4" fill="#eee"/>`; }
    if (kind === 'checker') { for (let r = 0; r < 4; r++) for (let k = 0; k < 13; k++) if ((r + k) % 2 === 0) s += `<rect x="${k * 30 - 15}" y="${195 + r * 27}" width="30" height="27" fill="${c2}"/>`; return s; }
    if (kind === 'grass') { for (let i = 0; i < 40; i++) s += `<path d="M${(i * 37) % 360},${200 + (i * 53) % 98} l2,-5 l2,5" stroke="${c2}" fill="none"/>`; return s; }
    for (let i = 0; i < 7; i++) { const y = 195 + i * 15; s += `<path d="M0,${y} H360" stroke="${c2}" stroke-width="1"/>`; for (let j = 0; j < 6; j++) s += `<path d="M${(j * 70 + (i % 2) * 35)},${y} v15" stroke="${c2}" stroke-width="1"/>`; }
    return s + `<rect y="192" width="360" height="4" fill="#fff" opacity=".9"/>`;
  },
  windowW: (x, y, w, h) => { if (ART.night()) { let st = ''; for (let i = 0; i < 6; i++) st += `<circle class="bulb" style="animation-delay:${-i * .4}s" cx="${x + 6 + (i * 37) % (w - 12)}" cy="${y + 8 + (i * 23) % (h * .5)}" r="1" fill="#fff"/>`; return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#1c2547"/><circle cx="${x + w - 13}" cy="${y + 15}" r="7" fill="#f4e7b8"/>${st}<path d="M${x},${y + h * .72} q${w * .3},-14 ${w * .55},-4 q${w * .25},-10 ${w * .45},0 V${y + h} H${x}Z" fill="#121a36"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#fff" stroke-width="5"/><path d="M${x + w / 2},${y} v${h} M${x},${y + h / 2} h${w}" stroke="#fff" stroke-width="3"/>`; }
    const se = ART.season(), sky = { hiver: '#cfd9e6', printemps: '#c6e6f7', ete: '#aee0fb', automne: '#e9d9bf' }[se], hill = { hiver: '#f4f7fa', printemps: '#a9d3a0', ete: '#8cc474', automne: '#d9a55a' }[se];
    let fl = ''; if (se !== 'ete') for (let i = 0; i < 7; i++) fl += `<circle class="fall" style="animation-delay:${-i * .7}s;animation-duration:${se === 'hiver' ? 4.5 : 6}s" cx="${6 + i * (w - 12) / 6}" cy="-4" r="${se === 'hiver' ? 1.6 : 2}" fill="${{ hiver: '#fff', printemps: '#f7b9cd', automne: '#d9762b' }[se]}"/>`;
    else fl = `<circle cx="${w - 12}" cy="14" r="8" fill="#ffe27a"/>`;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${sky}"/><path d="M${x},${y + h * .72} q${w * .3},-14 ${w * .55},-4 q${w * .25},-10 ${w * .45},0 V${y + h} H${x}Z" fill="${hill}" opacity=".9"/><svg x="${x}" y="${y}" width="${w}" height="${h}" style="--fh:${h + 10}px">${fl}</svg><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#fff" stroke-width="5"/><path d="M${x + w / 2},${y} v${h} M${x},${y + h / 2} h${w}" stroke="#fff" stroke-width="3"/>`; },
  curtain: (x, y1, y2, c) => (c = ART.curtain(c), `<path d="M${x - 9},${y1} h18 q-4,${(y2 - y1) / 2} 3,${y2 - y1} h-22 q6,${-(y2 - y1) / 2} 1,${-(y2 - y1)}Z" fill="${c}"/><path d="M${x - 3},${y1} q-3,${(y2 - y1) / 2} 0,${y2 - y1} M${x + 4},${y1} q-3,${(y2 - y1) / 2} 2,${y2 - y1}" stroke="#0001" fill="none"/>`),
  sofa: (x, y, c, c2) => `<g transform="translate(${x},${y})"><rect x="0" y="0" width="118" height="40" rx="11" fill="${c}"/><rect x="-4" y="16" width="20" height="44" rx="8" fill="${c2}"/><rect x="102" y="16" width="20" height="44" rx="8" fill="${c2}"/><rect x="12" y="28" width="94" height="28" rx="6" fill="${c}"/><path d="M43,30 v24 M75,30 v24" stroke="#0002" stroke-width="1.4"/><rect x="2" y="56" width="114" height="6" rx="2" fill="${c2}"/><rect x="6" y="62" width="5" height="5" fill="#3a2a20"/><rect x="107" y="62" width="5" height="5" fill="#3a2a20"/></g>`,
  plaidVert: (x, y) => `<g data-hs="plaidvert" transform="translate(${x},${y})"><path d="M0,0 h26 l3,40 l-27,5Z" fill="#3f8f5f"/><path d="M6,0 l1,44 M14,0 l2,42 M21,0 l3,41 M0,12 h28 M1,26 h28" stroke="#2f6f48" stroke-width="1"/><path d="M2,45 v4 M8,44 v4 M14,43 v4 M20,42 v4 M26,41 v4" stroke="#3f8f5f" stroke-width="1.5"/></g>`,
  coussinVert: (x, y) => `<rect data-hs="plaidvert" x="${x}" y="${y}" width="24" height="21" rx="6" fill="#4d9d6b" transform="rotate(-8 ${x + 12} ${y + 10})"/>`,
  rug: (cx, cy, rx, ry, st) => { const r = RUGS.find(x => x[0] === (st !== undefined ? st : ART.rug())) || RUGS[0], [, , a, b, pat] = r[0] ? r : ['', '', '#ead9bd', '#d6c3a0', 'dash'];
    let t = `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${a}" stroke="${b}" stroke-width="2"/>`;
    if (pat === 'stripe') for (let i = -2; i <= 2; i++) t += `<ellipse cx="${cx}" cy="${cy}" rx="${rx * (.25 + Math.abs(i) * .17)}" ry="${ry * (.25 + Math.abs(i) * .17)}" fill="none" stroke="${b}" stroke-width="1.400"/>`;
    else if (pat === 'berb') for (let i = 0; i < 7; i++) t += `<path d="M${cx - rx * .6 + i * rx * .2},${cy - ry * .35} l${rx * .1},${ry * .35} l${-rx * .1},${ry * .35}" stroke="${b}" fill="none" stroke-width="1.200"/>`;
    else t += `<ellipse cx="${cx}" cy="${cy}" rx="${rx - 9}" ry="${ry - 5}" fill="none" stroke="${b}" stroke-dasharray="3 4"/>`;
    return t; },
  tableTeckel: (cx, cy) => `<g transform="translate(${cx},${cy})"><ellipse cx="0" cy="19" rx="16" ry="4" fill="#e6e6e6"/><rect x="-4" y="1" width="8" height="18" fill="#efefef"/><ellipse cx="0" cy="0" rx="31" ry="9.5" fill="#ffffff" stroke="#dcdcdc"/>` +

      if (i === 0) { const m = 'Trois heures, noir et blanc, sous-titres. Léo a pleuré à la fin. Léonore a dormi de la minute 40 à la minute 170. En sortant, elle a dit : « J’ai bien aimé la lumière. »'; await narr(m); S.chars.leo.cine += 1; love(1); memory('🎞️', 'Le film de trois heures', m); }
      if (i === 1) { await say('leo', 'Moi je serais allé la chercher à l’aéroport direct.'); await say('leonore', 'T’es venu me chercher à Bicêtre sous la pluie avec un parapluie cassé.'); await say('leo', 'Ben voilà. Pareil.'); const m = 'Ils ont critiqué le héros pendant 1 h 40, assez fort pour qu’une dame se retourne. Elle était d’accord avec eux.'; await narr(m); love(2); memory('🍿', 'La comédie romantique', m); }
      if (i === 2) { const m = 'Elle a commenté chaque blessure à voix haute : « Ça, c’est pas mortel. Ça non plus. Ah, ça, si. » Toute la rangée s’est décalée. Lui, il a tenu sa main tout le film. Pour elle, bien sûr.'; await narr(m); S.chars.leonore.med += 1; love(1); memory('😱', 'Le film d’horreur commenté', m); }
      if (first) { S.flags.ticket = S.day; await narr('Elle range les deux tickets dans son petit meuble à quatre cases, en bas à droite. Elle dit que c’est « pour les impôts ».'); }
    } },
  { id: 'voyage', who: 'both', icon: '✈️', name: () => 'Partir en voyage', desc: () => `−${eur(300 * mult())} · +3 ❤ · un grand souvenir`,
    can: () => S.stage < 1 ? 'Quand on habitera ensemble' : (wallet() >= 300 * mult() || 'Pas assez d’argent à deux'),
    run: async () => {
      const all = [
        { k: 'hanoi', t: 'Hanoï, dans la famille d’Anne', i: '🏮', m: 'Hanoï. Anne avait fait une liste de quatorze adresses et de neuf cousins. Ils ont mangé un pho assis sur des tabourets de vingt centimètres. Léo ne pouvait plus se relever. Un cousin l’a aidé.' },
        { k: 'baviere', t: 'La Bavière, côté Stéphane', i: '🏔️', m: 'La Bavière. Stéphane avait préparé un itinéraire minuté, avec les horaires des trains. Léonore a parlé allemand à une boulangère. Léo a dit « danke » à tout le monde, y compris à un distributeur.' },
        { k: 'bh', t: 'Belo Horizonte, où Léo a étudié', i: '🌴', m: 'Belo Horizonte. Il lui a montré le campus, le marché, le bar où il a écrit sa première scène. Le patron l’a reconnu. Il a sorti une ardoise de 2025.' },
        { k: 'bretagne', t: 'Un week-end en Bretagne', i: '🌊', m: 'Bretagne. Il a plu de travers pendant deux jours. Ils ont une photo d’eux trempés devant un phare qu’on ne voit pas.' }
      ].filter(o => !S.flags['voy_' + o.k]);
      if (!all.length) { await narr('Ils sont déjà allés partout où ils voulaient. Pour l’instant.'); return; }
      const i = await choose(null, 'On part où ?', all.map(o => o.t));
      const o = all[i]; payShared(300 * mult()); S.flags['voy_' + o.k] = S.day;
      at(null, 0, ['leonore', 'leo']);
      await narr(o.m); memory(o.i, o.t.split(',')[0], o.m); love(3);
      if (S.pets.length || S.kids.length) await say('mathys', '📱 j’ai gardé la maison. tout va bien. regardez pas dans le frigo en rentrant');
    } }
];

function payGarde(score) { return (30 + score * 14 + (has('stetho') ? 15 : 0) + Math.min(S.chars.leonore.med, 25)) * mult(); }
function payOf(id) {
  const m = mult();
  if (id === 'dossier') return (90 + (has('cafe') ? 20 : 0) + Math.min(S.chars.leo.deals, 20) * 4) * m;
  return 0;
}

/* ---------- La guerre du houmous : Yanis contre Mathys, round après round ---------- */
async function guerreHoumous() {
  const n = S.counters.guerre = (S.counters.guerre || 0) + 1; S.flags.guerre = 1;
  at(S.stage === 0 ? 'coloc' : null, 0, ['leonore', 'yanis', 'mathys', 'camille']);
  UI.slug = `YANIS CONTRE MATHYS — ROUND ${n}`;
  if (n === 1) { await say('yanis', 'J’ai fait un houmous. C’est la recette de ma grand-mère. Si Mathys y met un doigt, je le range dans le four.'); await say('mathys', 'Je fais que regarder.'); await say('yanis', 'Avec tes doigts ?'); }
  else if (n === 2) { await narr('Yanis a mis un couvercle sur son houmous. Avec un cadenas. Mathys est arrivé avec un tournevis.'); await say('mathys', 'C’est pour resserrer une étagère.'); await say('yanis', 'Y a pas d’étagère.'); await say('mathys', 'Pas encore.'); }
  else if (n === 3) { await narr('Yanis a fait deux houmous. Un vrai. Et un piège, avec quatre piments.'); await say('camille', 'Il a mangé le piège. En entier.'); await say('mathys', 'Il est mieux que l’autre.'); await say('yanis', 'Je vais le tuer.'); }
  else { await narr('Mathys a fait SON houmous. Il est gris. Il veut que Yanis goûte.'); await say('yanis', 'C’est quoi, les morceaux ?'); await say('mathys', 'Des pois chiches. Je crois. Y avait plus d’étiquette.'); }
  const r = await Mini.houmous(); bestOf('houmous', r.score);
  if (r.dips === 0) { await say('yanis', 'Intact. INTACT. Léonore, t’es ma sœur.'); await say('mathys', 'J’avais pas faim de toute façon.'); }
  else if (r.dips <= 3) { await say('yanis', `${r.dips} doigt${r.dips > 1 ? 's' : ''}. Je les ai comptés. Je vois les traces.`); await say('mathys', 'Je goûtais. Pour toi. Pour la qualité.'); }
  else { await say('yanis', 'Il a mis LA MAIN. Entière. Y a une empreinte.'); await say('mathys', 'Il était tiède. Je voulais savoir jusqu’où.'); }
  incident(['Yanis a menacé de me ranger dans un four. Pour du houmous.', 'On m’a accusé d’avoir un tournevis. J’avais un tournevis. C’est pas la question.', 'J’ai mangé un houmous avec quatre piments. On voulait me nuire. J’ai adoré.', 'J’ai cuisiné pour Yanis. Il a refusé de goûter. Je suis blessé et lui aussi, bientôt.'][Math.min(3, n - 1)]);
  const c = await choose('leonore', 'Tu prends parti ?', ['Pour Yanis. Évidemment.', 'Pour Mathys. Il faut bien quelqu’un.', 'Les enfermer tous les deux dans la cuisine']);
  if (c === 0) { await say('mathys', 'Trahi. Dans ma propre coloc. Par ma propre Léonore.'); earn('leonore', Math.max(0, r.score) * 3 * mult()); await narr('Yanis lui laisse la moitié du houmous et un billet « pour le service de sécurité ».'); }
  if (c === 1) { await say('yanis', 'Tu le défends ? LUI ?'); await say('leonore', 'Il est sale, mais c’est le mien.'); await say('mathys', '… C’est la plus belle chose qu’on m’ait dite.'); love(0 + 1); }
  if (c === 2) { await narr(n >= 3 ? 'Vingt minutes plus tard, ils ressortent. Ils ont fait un houmous à deux. Aucun des deux ne veut dire qui a fait quoi. Trêve : onze minutes.' : 'On entend crier. Puis plus rien. Puis rire. Puis crier. Ils ressortent sans se regarder.'); earn('leonore', Math.max(0, r.score) * 2 * mult()); if (n >= 3) S.flags.treve = 1; }
}

let AC = null, MUTED = false;
try { MUTED = localStorage.getItem('milife.prefs.muted') === '1'; } catch (e) {}
function setMuted(v) { MUTED = !!v; try { localStorage.setItem('milife.prefs.muted', MUTED ? '1' : '0'); } catch (e) {} }
function sfx(name) {
  if (MUTED) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const tone = (f, d, type, v, at) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t + (at || 0)); g.gain.setValueAtTime(v || .06, t + (at || 0)); g.gain.exponentialRampToValueAtTime(.0001, t + (at || 0) + d); o.connect(g).connect(AC.destination); o.start(t + (at || 0)); o.stop(t + (at || 0) + d + .02); };
    if (/^n\d$/.test(name)) tone([330, 392, 494, 587][+name[1]], .26, 'triangle', .08);
    if (name === 'tap') tone(520, .05, 'triangle', .03);
    if (name === 'coin') { tone(880, .09, 'square', .03); tone(1320, .14, 'square', .03, .08); }
    if (name === 'pop') tone(300, .12, 'triangle', .09);
    if (name === 'bad') tone(140, .25, 'sawtooth', .05);
    if (name === 'love') { tone(660, .12, 'sine', .06); tone(880, .22, 'sine', .06, .1); }
    if (name === 'glouglou') [0, .13, .24, .33, .41].forEach((at, i) => { const f0 = 520 - i * 50 + Math.random() * 40; const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f0, t + at); o.frequency.exponentialRampToValueAtTime(f0 * 1.9, t + at + .07); g.gain.setValueAtTime(.05, t + at); g.gain.exponentialRampToValueAtTime(.0001, t + at + .09); o.connect(g).connect(AC.destination); o.start(t + at); o.stop(t + at + .1); });
    if (name === 'fanfare') [523, 659, 784, 1047].forEach((f, i) => tone(f, .24, 'triangle', .06, i * .13));
    if (name === 'flush') {
      const len = AC.sampleRate * 2.2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1);
      const src = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
      src.buffer = buf; bp.type = 'bandpass'; bp.Q.value = .8;
      bp.frequency.setValueAtTime(1800, t); bp.frequency.exponentialRampToValueAtTime(180, t + 2.1);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.28, t + .15); g.gain.exponentialRampToValueAtTime(.0001, t + 2.2);
      src.connect(bp).connect(g).connect(AC.destination); src.start(t);
    }
  } catch (e) { /* pas de son, pas grave */ }
}

/* Coquille commune : titre, compteurs, zone de jeu, écran de fin avec la morale. */
function mgOpen(title, hint, body, unit) {
  const ov = document.querySelector('#overlay');
  ov.className = 'show';
  ov.innerHTML = `<div class="mg"><div class="mgTop"><b>${title}</b><span class="mgT">⏱ <i id="mgTime">–</i></span><span class="mgS">${unit || '⭐'} <i id="mgScore">0</i></span></div>
    <p class="mgHint" id="mgHint">${hint}</p><div class="mgBody" id="mgBody">${body}</div><button class="primary" id="mgGo">C’est parti</button></div>`;
  return ov;
}
function mgEnd(ov, headline, moral, result, res) {
  const body = ov.querySelector('#mgBody');
  body.innerHTML = `<div class="moral"><h3>${headline}</h3><p class="mq">${moral}</p><small>La morale de l’histoire</small></div>`;
  ov.querySelector('#mgHint').textContent = '';
  const b = ov.querySelector('#mgGo'); b.textContent = 'Continuer'; b.style.display = ''; b.disabled = true;
  setTimeout(() => { b.disabled = false; }, 900);
  b.onclick = () => { ov.className = ''; ov.innerHTML = ''; res(result); };
  sfx('fanfare');
}

   Par défaut : le contenu intégré (CONTENU_INTEGRE). On peut installer un

    if (p.format !== 'milife.pack') return { ok: false, error: 'Ce fichier n’est pas un paquet de souvenirs Mi Life (format inconnu).' };
    if (p.schema !== SCHEMA) return { ok: false, error: `Paquet au format v${p.schema}, ce jeu lit le format v${SCHEMA}.` };
    if (typeof p.id !== 'string' || !/^[a-z0-9-]{2,40}$/.test(p.id)) return { ok: false, error: 'Paquet sans identifiant valide.' };
    if (!Number.isInteger(p.version) || p.version < 1) return { ok: false, error: 'Paquet sans numéro de version valide.' };
    if (typeof p.title !== 'string' || !p.title) return { ok: false, error: 'Paquet sans titre.' };
    if (!Array.isArray(p.episodes) || !p.episodes.length) return { ok: false, error: 'Le paquet ne contient aucun épisode.' };
    const ids = new Set();

      for (const s of steps) {

        if ((s.t === 'say' || s.t === 'sms') && !own(PEOPLE, s.who)) throw new Error(`${where} : personnage inconnu « ${s.who} ».`);
        if ((s.t === 'choice' || s.t === 'quiz') && s.who != null && !own(PEOPLE, s.who)) throw new Error(`${where} : personnage inconnu « ${s.who} ».`);
        if (s.t === 'item' && !own(ITEMS, s.id)) throw new Error(`${where} : objet inconnu « ${s.id} ».`);
        if (s.t === 'scene') {
          const h = s.home && s.home !== 'here' ? s.home : null;
          if (h && !own(ROOMS, h)) throw new Error(`${where} : logement inconnu « ${h} ».`);
          if (s.room != null && (!Number.isInteger(s.room) || s.room < 0 || s.room >= (h ? ROOMS[h].rooms.length : 1))) throw new Error(`${where} : pièce invalide « ${s.room} ».`);
          if (s.cast && (!Array.isArray(s.cast) || s.cast.some(c => !own(PEOPLE, c)))) throw new Error(`${where} : distribution invalide.`);
        }
        if ((s.t === 'narr' || s.t === 'say' || s.t === 'sms' || s.t === 'letter') && typeof s.text !== 'string') throw new Error(`${where} : texte manquant.`);
        if (s.t === 'choice' || s.t === 'quiz') { if (!Array.isArray(s.options) || s.options.length < 2) throw new Error(`${where} : choix sans options.`); s.options.forEach((o, i) => o.then && walk(o.then, `${where}, option ${i + 1}`)); }

      }
    };
    try {
      p.episodes.forEach((e, i) => {

        if (ids.has(e.id)) throw new Error(`${w} : identifiant « ${e.id} » en double.`);

   privé, puis les post-its d'origine (MOTS_LEO, compteur S.counters.mots).

const epState = id => { const d = S.daily; return (d.ep[id] = d.ep[id] || { answers: {}, items: {}, plays: 0 }); };

/** La surprise débloquée et pas encore lue (au plus une), ou null. */
function pendingSurprise() {
  const autoNote = (S.notes || []).find(n => n.auto && n.from === 'leo' && !n.read);
  for (let i = S.daily.unlocked.length - 1; i >= 0; i--) {
    const u = S.daily.unlocked[i];
    if (u.kind === 'ep' && Pack.episode(u.id.slice(3)) && !(S.daily.ep[u.id.slice(3)] || {}).read) return { kind: 'ep', id: u.id.slice(3) };
  }

}
/** Prochaine surprise de la série, sans la débloquer. */
function seriesNext() {
  for (const ep of Pack.episodes()) if (!isUnlocked('ep:' + ep.id)) return { kind: 'ep', id: ep.id };
  const n = S.counters.mots || 0;
  if (n < MOTS_LEO.length) return { kind: 'mot', n };
  return null;
}
/** Débloque la prochaine surprise du jour de jeu et vérifie les anniversaires réels. */
function checkDaily() {
  if (!S || !S.seen.intro || !S.daily) return false;
  const d = S.daily, today = todayKey(); let news = false;
  // rappels d'anniversaire (en plus, une fois par an)
  const now = new Date();
  for (const a of (Pack.get() && Pack.get().anniversaries) || []) {
    const k = `${a.id}:${now.getFullYear()}`;
    if (a.m === now.getMonth() + 1 && a.d === now.getDate() && !d.anniv[k]) { d.anniv[k] = { day: today, read: false }; news = true; }
  }
  if (S.day > d.lastGameDay && !pendingSurprise()) {
    const nx = seriesNext();

function tpl(t, ctx) {

}
function condOk(c, ctx) {

async function runStep(s, ctx) {

    case 'sms': return say(s.who, '📱 ' + T(s.text));
    case 'scene': return at(s.home && s.home !== 'here' ? s.home : null, s.room || 0, s.cast || ['leonore'], s.title ? T(s.title) : undefined);
    case 'stage': return runSteps(S.stage === 0 ? s.early : (s.later || s.early), ctx);
    case 'if': return runSteps(condOk(s.cond || s, ctx) ? s.then : s.else, ctx);
    case 'choice': {
      const opts = s.options.filter(o => condOk(o.cond, ctx));
      if (!opts.length) return;
      const i = await choose(s.who === undefined ? 'leonore' : s.who, T(s.prompt), opts.map(o => T(o.label)));
      const o = opts[i], val = o.value !== undefined ? o.value : i;
      if (s.key) {
        if (s.keep === 'history') { const h = ctx.st.answers[s.key + '_all'] = ctx.st.answers[s.key + '_all'] || []; h.push(val); if (h.length > 12) h.shift(); ctx.st.answers[s.key] = val; }
        else if (!(s.key in ctx.st.answers)) ctx.st.answers[s.key] = val;
        Save.write(S, 'ep:answer');

      return runSteps(o.then, ctx);
    }
    case 'recall': {   // rappelle un choix : de cet épisode, ou d'un autre (from)
      const src = s.from ? (S.daily.ep[s.from] || { answers: {} }).answers : ctx.st.answers;
      const h = src[s.key + '_all'], prev = s.previous ? (h && h.length > 1 ? h[h.length - 2] : undefined) : src[s.key];

      if (prev === undefined && s.none) return narr(T(s.none));

      let opts = s.options.map((o, i) => ({ o, i }));

        await narr(T(pick.o.hint || (s.hints || [])[n] || 'Raté. Mais tu chauffes.'));
        opts = opts.filter(x => x !== pick);
        if (opts.length <= 1) { if (s.reveal) await narr(T(s.reveal)); break; }
      }

    case 'tap': return tapMoment(s);
    case 'letter': return showLetter(nick(T(s.title || '')), nick(T(s.text)), s.audio ? Pack.media(s.audio) : null, nick(T(s.sign || '')));
    case 'photo': { const m = Pack.media(s.media); if (m) return showLetter(T(s.caption || ''), '', null, '', m); return; }
    case 'item': {

      return s.text ? narr(T(s.text)) : undefined;
    }
    case 'memory': {

      if (!S.memories.some(m => m.ref === ref)) { S.memories.push({ day: S.day, date: S.date, icon: s.icon || '📔', title: '', text: '', ref }); toast('📔 Nouveau souvenir'); Save.write(S, 'ep:memory'); }

      const k = s.t + ':' + (s.key || s.text || s.n || 1); ctx.st.done = ctx.st.done || {};

async function story() {

    ['intro', () => true],

  if (d.baby) return haveBaby();
  if (d.prep) return prep(d.prep);
  if (d.party) return party();
  if (d.mail) return readMail();
  if (d.note) return writeNote();
  if (d.readnote) return readNote(d.readnote);
  if (d.settings) return showSettings();
  if (d.surprise) return d.surprise === '1' ? openSurprise() : playEpisode(d.surprise, false);
  if (d.replay) return playEpisode(d.replay, true);
  if (d.anniv) return playAnniv();
  if (d.pack) return showPack(() => { $('#overlay').className = ''; $('#overlay').innerHTML = ''; render(); });
});

(async function boot() {
  ART.outfitFor = id => (S && S.chars[id] ? S.chars[id].outfit : null);
  ART.flags = () => (S ? S.flags : {});
  ART.activeId = () => (S ? S.active : 'leonore');
  ART.looks = id => (!S ? {} : id === 'leonore' ? { hair: S.flags.hairL, hairColor: S.flags.hairColL, glasses: S.flags.glassL, cap: S.flags.capL } : id === 'leo' ? { beard: S.flags.beardLeo, hair: S.flags.hairLeo, cap: S.flags.capLeo, glasses: S.flags.glassLeo } : {});
  ART.wall = (k, d) => roomSet('wall') || (S && S.flags['wall_' + k]) || d;
  ART.night = () => !!S && !UI.override && S.chars[S.active].moves <= 0;
  ART.season = () => { const m = new Date(S ? S.date : Date.now()).getMonth(); return m === 11 || m < 2 ? 'hiver' : m < 5 ? 'printemps' : m < 8 ? 'ete' : 'automne'; };
  $('#scene').addEventListener('click', onSceneTap);
  $('#scene').addEventListener('pointerdown', decorPointerDown);
  $('#scene').addEventListener('pointermove', decorPointerMove);
  $('#scene').addEventListener('pointerup', decorPointerUp);
  $('#scene').addEventListener('pointercancel', () => { decorDrag = null; if (UI.decor) render(); });
  const saved = await Save.load();
  if (!showUpdateNotice(saved)) showTitle(saved);
  setInterval(() => { if (S && !document.hidden && !document.querySelector('#overlay.title')) S.stats.ms = (S.stats.ms || 0) + 1000; }, 1000);
  window.MiLife = { Save, Pack, get state() { return S; }, UI, Mini, render, placeItems, checkDaily, todayKey, openDecor };
})();

</script>
